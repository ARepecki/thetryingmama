<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Trying Mama Newsletter</title>

    <!-- Modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <nav class="navbar">
        <a href="index.html" class="brand">
            <img src="img/TheTryingMamaLogo.jpg" alt="The Trying Mama Logo" class="logo">
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="story.html">The Trying Mama Story</a>
            <a href="recipes.html">Recipes</a>
            <a href="blog.html">Blog</a>
            <a href="newsletter.html">Newsletter</a>
        </div>
    </nav>
</header>

<main class="container">
    <article class="card">
        <h1>Newsletter</h1>
        <p class="tagline">
            Join The Trying Mama community — real stories, real recipes, real life.
        </p>

        <form id="newsletter-form" class="form">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <button type="submit" class="btn">Subscribe</button>
        </form>

        <p id="newsletter-message" class="form-message"></p>
    </article>
</main>

<script src="js/main.js"></script>
</body>
</html>
